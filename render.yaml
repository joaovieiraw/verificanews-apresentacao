services:
  - type: web
    name: verificanews
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node src/server.js
    healthCheckPath: /api/status
    envVars:
      - key: NODE_VERSION
        value: 22.23.4
      - key: NODE_ENV
        value: production
      - key: PROVIDER
        value: gemini-tavily
      - key: STORAGE
        value: memory
      - key: LOCAL_SETUP
        value: "false"
      - key: SESSION_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: RETENTION_DAYS
        value: "1"
